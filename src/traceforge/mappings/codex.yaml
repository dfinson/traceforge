# Codex CLI — YAML mapping for traceforge
#
# OpenAI Codex CLI stores rollout logs in:
#   ~/.codex/sessions/rollout-{timestamp}-{uuid}.jsonl
#
# Each line: {"timestamp": "...", "type": "...", "payload": {...}}
# The "codex" preprocessor flattens the double-type nesting (type + payload.type)
# into a single "block_type" discriminator.
#
# Source: openai/codex@bd2de422 (main, audited 2026-07-27)
# Schema: codex-rs/protocol/src/protocol.rs (RolloutLine → RolloutItem)
# Persistence: codex-rs/rollout/src/policy.rs
# Durable collaboration is recorded as inter_agent_communication_metadata plus
# response_item.agent_message. The collab_* EventMsg variants are transient at
# this revision, but remain mapped for direct streams and older/alternate
# producers that feed EventMsg records to this adapter.
# Tool calls arrive via two paths:
#   1. response_item.function_call → model's request (shell tool)
#   2. event_msg.mcp_tool_call_begin/end → MCP tool execution lifecycle

framework: codex
framework_version: "1.x"
ingestion_mode: file_watch
type_field: block_type
default_kind: raw
preprocessor: codex

motivation:
  sources:
    - events: ["message.assistant"]
      field: content
      role: intent

events:
  # ── Session metadata (first line of every file) ────────────────────────────
  session.meta:
    kind: session.start
    payload:
      session_id: session_id
      model_provider: model_provider
      cwd: cwd
      cli_version: cli_version

  # ── Shell tool calls (model → built-in shell) ─────────────────────────────
  tool.shell_call:
    kind: tool.call.started
    payload:
      tool_call_id: call_id
      tool_name: tool_name
      arguments: arguments

  tool.shell_result:
    kind: tool.call.completed
    payload:
      tool_call_id: call_id
      result: output

  # ── Exec lifecycle (actual execution) ──────────────────────────────────────
  tool.exec_begin:
    kind: tool.exec.started
    payload:
      tool_call_id: call_id
      command: command
      cwd: cwd

  tool.exec_end:
    kind: tool.exec.completed
    payload:
      tool_call_id: call_id
      command: command
      cwd: cwd
      exit_code: exit_code
      stdout: stdout
      stderr: stderr

  # ── MCP tool calls ─────────────────────────────────────────────────────────
  tool.mcp_call:
    kind: tool.call.started
    payload:
      tool_call_id: call_id
      tool_name: tool_name
      server: server
      arguments: arguments

  tool.mcp_result:
    kind: tool.call.completed
    payload:
      tool_call_id: call_id
      tool_name: tool_name
      is_error: is_error
      result: output

  # ── Custom tool calls ──────────────────────────────────────────────────────
  tool.custom_call:
    kind: tool.call.started
    payload:
      tool_call_id: call_id
      tool_name: tool_name
      arguments: arguments

  tool.custom_result:
    kind: tool.call.completed
    payload:
      tool_call_id: call_id
      tool_name: tool_name
      result: output

  # ── Approval requests ──────────────────────────────────────────────────────
  tool.approval_request:
    kind: tool.approval.requested
    payload:
      tool_call_id: call_id
      command: command

  # ── Messages ───────────────────────────────────────────────────────────────
  message.user:
    kind: message.user
    payload:
      content: content

  message.assistant:
    kind: message.assistant
    payload:
      content: content

  # ── Durable multi-agent communication ──────────────────────────────────────
  agent.communication:
    kind: agent.handoff
    payload:
      communication_id: id
      from_agent: author
      to_agent: recipient
      other_recipients: other_recipients
      content: content
      trigger_turn: trigger_turn
      turn_id: turn_id
      content_encrypted: content_encrypted
  agent.communication.metadata:
    kind: session.info
    payload:
      trigger_turn: trigger_turn

  # ── Streaming deltas (#41: event_msg passthrough as event.<type>) ──
  event.agent_message_content_delta:
    kind: llm.output.chunk
    payload:
      delta: delta
  event.exec_command_output_delta:
    kind: tool.output.chunk
    payload:
      call_id: call_id
      chunk: chunk
  event.reasoning_content_delta:
    kind: llm.reasoning.chunk
    payload:
      delta: delta
  # Raw chain-of-thought is sensitive and opt-in upstream. Recognize the event,
  # but deliberately omit delta so it cannot enter normal reasoning or sinks.
  event.reasoning_raw_content_delta:
    kind: raw
    payload:
      thread_id: thread_id
      turn_id: turn_id
      item_id: item_id
      content_index: content_index

  # ── Item lifecycle v2 (#41: event_msg passthrough as event.<type>) ──
  event.item_started:
    kind: session.info
    payload:
      item: item
  event.item_completed:
    kind: session.info
    payload:
      item: item

  # ── Hooks (#41) ──
  event.hook_started:
    kind: hook.started
    payload:
      hook_name: run.event_name
  event.hook_completed:
    kind: hook.completed
    payload:
      hook_name: run.event_name

  # ── Multi-agent lifecycle ──────────────────────────────────────────────────
  # Only completions with an exact canonical meaning receive agent.* kinds.
  # Ambiguous operation lifecycle events stay session.info rather than inventing
  # kinds or misrepresenting an agent's final state.
  event.collab_agent_spawn_begin:
    kind: session.info
    payload:
      operation_id: call_id
      started_at_ms: started_at_ms
      sender_thread_id: sender_thread_id
      model: model
      reasoning_effort: reasoning_effort
  event.collab_agent_spawn_end:
    kind: agent.spawned
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      agent_id: new_thread_id
      agent_nickname: new_agent_nickname
      agent_role: new_agent_role
      model: model
      reasoning_effort: reasoning_effort
      status: status
  event.collab_agent_spawn_failed:
    kind: agent.failed
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      agent_nickname: new_agent_nickname
      agent_role: new_agent_role
      model: model
      reasoning_effort: reasoning_effort
      status: status
  event.collab_agent_interaction_begin:
    kind: session.info
    payload:
      operation_id: call_id
      started_at_ms: started_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
  event.collab_agent_interaction_end:
    kind: agent.handoff
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
      receiver_agent_nickname: receiver_agent_nickname
      receiver_agent_role: receiver_agent_role
      status: status
  event.collab_waiting_begin:
    kind: session.info
    payload:
      operation_id: call_id
      started_at_ms: started_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_ids: receiver_thread_ids
      receiver_agents: receiver_agents
  event.collab_waiting_end:
    kind: session.info
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      agent_statuses: agent_statuses
      statuses: statuses
  event.collab_close_begin:
    kind: session.info
    payload:
      operation_id: call_id
      started_at_ms: started_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
  event.collab_close_end:
    kind: session.info
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
      receiver_agent_nickname: receiver_agent_nickname
      receiver_agent_role: receiver_agent_role
      status: status
  event.collab_resume_begin:
    kind: session.info
    payload:
      operation_id: call_id
      started_at_ms: started_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
      receiver_agent_nickname: receiver_agent_nickname
      receiver_agent_role: receiver_agent_role
  event.collab_resume_end:
    kind: session.info
    payload:
      operation_id: call_id
      completed_at_ms: completed_at_ms
      sender_thread_id: sender_thread_id
      receiver_thread_id: receiver_thread_id
      receiver_agent_nickname: receiver_agent_nickname
      receiver_agent_role: receiver_agent_role
      status: status
  event.sub_agent_activity:
    kind: session.info
    payload:
      event_id: event_id
      occurred_at_ms: occurred_at_ms
      agent_thread_id: agent_thread_id
      agent_path: agent_path
      activity_kind: kind
